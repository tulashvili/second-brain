server {
  listen 80;
  listen [::]:80;
  server_name bitsnbeing.com www.bitsnbeing.com;

  root /var/www/bitsnbeing;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # Old URLs from the previous /brain layout.
  location = /brain {
    return 301 /;
  }

  location ^~ /brain/ {
    rewrite ^/brain/(.*)$ /$1 permanent;
  }

  location ~* \.(?:css|js|mjs|map|json|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
